<div class="container">
    <h2>🔬 Диагностика растений по фото</h2>

    <div class="form-box" style="margin: 0;">
        <label>Выберите растение</label>
        <select>
            <option>Помидоры</option>
            <option>Огурцы</option>
            <option>Клубника</option>
            <option>Перец</option>
        </select>

        <label>Загрузите фото</label>
        <input type="file" accept="image/*">
        <button>🔍 Определить болезнь</button>
    </div>

    <div class="card" style="margin-top: 30px; background: #e8f5e9;">
        <h3>📋 Результат диагностики</h3>
        <p><b>Растение:</b> Помидоры</p>
        <p><b>Болезнь:</b> Фитофтороз</p>
        <p><b>Лечение:</b> Обработать бордоской жидкостью</p>
    </div>
</div>
