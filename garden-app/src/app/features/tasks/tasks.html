<div class="container">
    <h2>✅ Список дел на неделю</h2>

    <div *ngIf="tasks.length === 0">Загрузка задач...</div>

    <div class="cards" *ngIf="tasks.length > 0">
        <div class="card" *ngFor="let task of tasks">
            <h3>{{ task.description }}</h3>
            <p><b>Срок:</b> {{ task.dueDate | date:'dd.MM.yyyy' }}</p>
            
            <p *ngIf="task.isCompleted"><span class="badge ok">Выполнено</span></p>
            <p *ngIf="!task.isCompleted"><span class="badge">Не выполнено</span></p>
        </div>
    </div>

    <h2 style="margin-top: 40px;">➕ Новая задача</h2>
    <div class="form-box" style="margin: 0;">
        <label>Описание задачи</label>
        <input type="text" placeholder="Что нужно сделать?">
        <label>Срок</label>
        <input type="date">
        <button>Добавить задачу</button>
    </div>
</div>
