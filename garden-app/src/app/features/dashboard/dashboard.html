<div class="container">
    <h2>Мои растения</h2>

    <div class="card" style="margin-bottom: 20px; border-left-color: #ff9800;">
        <h3>💧 Напоминания о поливе</h3>
        <p><span class="badge">Внимание:</span> Некоторым растениям нужен полив!</p>
    </div>

    <div *ngIf="plants.length === 0">Загрузка растений...</div>

    <div class="cards" *ngIf="plants.length > 0">
        <div class="card" *ngFor="let plant of plants">
            <h3>{{ plant.name }}</h3>
            <p><b>Место:</b> {{ plant.location }}</p>
            <p><b>Посажено:</b> {{ plant.plantingDate | date:'dd.MM.yyyy' }}</p>
            
            <p *ngIf="plant.needsWatering"><span class="badge">Нужен полив</span></p>
            <p *ngIf="!plant.needsWatering"><span class="badge ok">Всё хорошо</span></p>
        </div>
    </div>
</div>
